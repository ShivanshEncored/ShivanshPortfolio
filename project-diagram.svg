<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <linearGradient id="pGradLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b4dff"/>
      <stop offset="50%" stop-color="#ff3d8a"/>
      <stop offset="100%" stop-color="#12c47a"/>
    </linearGradient>
    <linearGradient id="pAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b4dff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5b4dff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background grid lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="50" y1="80" x2="550" y2="80"/>
    <line x1="50" y1="160" x2="550" y2="160"/>
    <line x1="50" y1="240" x2="550" y2="240"/>
    <line x1="50" y1="320" x2="550" y2="320"/>
    <line x1="50" y1="400" x2="550" y2="400"/>
    <line x1="120" y1="40" x2="120" y2="440"/>
    <line x1="220" y1="40" x2="220" y2="440"/>
    <line x1="320" y1="40" x2="320" y2="440"/>
    <line x1="420" y1="40" x2="420" y2="440"/>
    <line x1="520" y1="40" x2="520" y2="440"/>
  </g>

  <!-- Financial Candlesticks -->
  <g>
    <!-- 1 -->
    <line x1="100" y1="280" x2="100" y2="360" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="94" y="300" width="12" height="40" rx="2" fill="#12c47a"/>
    <!-- 2 -->
    <line x1="140" y1="240" x2="140" y2="340" stroke="#ff3d8a" stroke-width="1.5"/>
    <rect x="134" y="260" width="12" height="50" rx="2" fill="#ff3d8a"/>
    <!-- 3 -->
    <line x1="180" y1="220" x2="180" y2="310" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="174" y="235" width="12" height="45" rx="2" fill="#12c47a"/>
    <!-- 4 -->
    <line x1="230" y1="180" x2="230" y2="290" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="224" y="200" width="12" height="55" rx="2" fill="#12c47a"/>
    <!-- 5 -->
    <line x1="280" y1="210" x2="280" y2="310" stroke="#ff3d8a" stroke-width="1.5"/>
    <rect x="274" y="225" width="12" height="40" rx="2" fill="#ff3d8a"/>
    <!-- 6 -->
    <line x1="330" y1="150" x2="330" y2="260" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="324" y="165" width="12" height="65" rx="2" fill="#12c47a"/>
    <!-- 7 -->
    <line x1="390" y1="120" x2="390" y2="220" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="384" y="135" width="12" height="55" rx="2" fill="#12c47a"/>
    <!-- 8 -->
    <line x1="450" y1="90" x2="450" y2="190" stroke="#ff3d8a" stroke-width="1.5"/>
    <rect x="444" y="110" width="12" height="45" rx="2" fill="#ff3d8a"/>
    <!-- 9 -->
    <line x1="500" y1="70" x2="500" y2="160" stroke="#12c47a" stroke-width="1.5"/>
    <rect x="494" y="80" width="12" height="50" rx="2" fill="#12c47a"/>
  </g>

  <!-- Area curve & Trend line -->
  <path d="M70,360 C120,340 160,260 210,240 C260,220 310,230 360,160 C410,90 460,130 520,70 L520,420 L70,420 Z" fill="url(#pAreaGrad)"/>
  <path d="M70,360 C120,340 160,260 210,240 C260,220 310,230 360,160 C410,90 460,130 520,70" stroke="url(#pGradLine)" stroke-width="3" stroke-linecap="round"/>

  <!-- Neural algorithmic network nodes -->
  <g fill="#ffc53d">
    <circle cx="210" cy="240" r="4"/>
    <circle cx="360" cy="160" r="5"/>
    <circle cx="520" cy="70" r="5"/>
  </g>
  <circle cx="520" cy="70" r="10" stroke="#ffc53d" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>
